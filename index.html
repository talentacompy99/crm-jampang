<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>CRM Dealer Motor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js"></script>
<style>
/* ===================== TAMPILAN ===================== */
:root{
  --ink:#0f172a; --ink2:#334155; --muted:#64748b; --faint:#94a3b8;
  --line:#e2e8f0; --line2:#f1f5f9; --bg:#f8fafc; --card:#ffffff;
  --blue:#2563eb; --blue-bg:#eff6ff; --green:#15803d; --green-bg:#dcfce7;
  --amber:#b45309; --amber-bg:#fef3c7; --red:#b91c1c; --red-bg:#fee2e2;
  --indigo:#4338ca; --indigo-bg:#e0e7ff; --sky:#0369a1; --sky-bg:#e0f2fe;
  --gray-bg:#f1f5f9; --r:16px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--blue);text-decoration:none}
.hidden{display:none!important}

/* layout */
.shell{min-height:100vh}
.side{display:none}
.top{position:sticky;top:0;z-index:20;height:56px;padding:0 16px;display:flex;align-items:center;justify-content:space-between;background:rgba(255,255,255,.9);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:-.3px}
.logo{width:32px;height:32px;border-radius:10px;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px}
.main{padding:16px 16px 96px;max-width:1100px;margin:0 auto}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
.bnav button{flex:1;border:0;background:none;padding:8px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--faint);cursor:pointer}
.bnav button .ic{font-size:19px;line-height:1.2}
.bnav button.on{color:var(--ink)}
@media(min-width:900px){
  .side{display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;width:232px;background:#fff;border-right:1px solid var(--line);padding:16px 12px;z-index:25}
  .side .brand{padding:4px 8px 18px}
  .side nav{display:flex;flex-direction:column;gap:4px}
  .side nav button{border:0;background:none;text-align:left;padding:10px 12px;border-radius:12px;font-weight:600;color:var(--ink2);cursor:pointer;display:flex;gap:10px;align-items:center}
  .side nav button:hover{background:var(--bg)}
  .side nav button.on{background:var(--ink);color:#fff}
  .side .who{margin-top:auto;padding:12px;border-top:1px solid var(--line2);font-size:12px;color:var(--muted)}
  .top{margin-left:232px}
  .top .brand{visibility:hidden}
  .main{margin-left:232px;padding:24px 28px 40px}
  .bnav{display:none}
}

/* komponen */
h1{font-size:22px;font-weight:800;letter-spacing:-.5px}
h2{font-size:16px;font-weight:800;letter-spacing:-.2px}
h3{font-size:14px;font-weight:700}
.sub{color:var(--muted);font-size:12.5px}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid4{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:700px){.grid4{grid-template-columns:repeat(4,1fr)}}
.mt{margin-top:14px}.mt2{margin-top:22px}
.stat{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px}
.stat b{display:block;font-size:24px;font-weight:800;letter-spacing:-.5px}
.stat span{font-size:11.5px;color:var(--muted);font-weight:600}
.btn{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 16px;font-weight:600;font-size:13px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:#cbd5e1}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.pri{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.blue{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.green{background:var(--green);border-color:var(--green);color:#fff}
.btn.danger{color:var(--red);border-color:#fecaca}
.btn.sm{padding:6px 12px;font-size:12px}
.btn.full{width:100%;padding:12px}
.wa{background:#16a34a;border-color:#16a34a;color:#fff}
.fab{position:fixed;right:18px;bottom:84px;z-index:19;border:0;border-radius:999px;background:var(--ink);color:#fff;padding:14px 20px;font-weight:700;box-shadow:0 10px 24px rgba(15,23,42,.25);cursor:pointer}
@media(min-width:900px){.fab{bottom:28px;right:28px}}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:12px;font-weight:600;color:var(--ink2)}
.inp{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);font-size:14px}
.inp:focus{outline:none;border-color:var(--ink);background:#fff}
textarea.inp{min-height:70px;resize:vertical}
.chk{display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer}
.chk input{width:18px;height:18px;accent-color:var(--ink)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 12px;font-size:12px;font-weight:600;white-space:nowrap;cursor:pointer}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:3px 9px;font-size:11px;font-weight:700;white-space:nowrap}
.p-gray{background:var(--gray-bg);color:var(--ink2)}.p-blue{background:var(--blue-bg);color:var(--blue)}
.p-green{background:var(--green-bg);color:var(--green)}.p-amber{background:var(--amber-bg);color:var(--amber)}
.p-red{background:var(--red-bg);color:var(--red)}.p-indigo{background:var(--indigo-bg);color:var(--indigo)}
.p-sky{background:var(--sky-bg);color:var(--sky)}
.item{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;gap:12px;align-items:center;cursor:pointer}
.item:hover{border-color:#cbd5e1}
.av{width:40px;height:40px;flex:none;border-radius:12px;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800}
.item .mid{flex:1;min-width:0}
.item .nm{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .meta{font-size:12px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{text-align:center;color:var(--faint);padding:28px 12px;border:1px dashed var(--line);border-radius:var(--r);background:#fff}
.note{font-size:12px;background:var(--blue-bg);color:#1e3a8a;border-radius:12px;padding:10px 12px;line-height:1.5}
.warn{font-size:12px;background:var(--amber-bg);color:#78350f;border-radius:12px;padding:10px 12px;line-height:1.5}
.bad{font-size:12px;background:var(--red-bg);color:#7f1d1d;border-radius:12px;padding:10px 12px;line-height:1.5}
.ok{font-size:12px;background:var(--green-bg);color:#14532d;border-radius:12px;padding:10px 12px;line-height:1.5}
.sec{border-top:1px solid var(--line2);padding-top:16px;margin-top:16px}
.sec>h3{margin-bottom:10px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13px}
.kv dt{color:var(--muted)}.kv dd{font-weight:600;text-align:right}
.steps{display:flex;gap:4px}
.steps div{flex:1;height:6px;border-radius:99px;background:var(--line)}
.steps div.on{background:var(--ink)}
.steps-l{display:flex;justify-content:space-between;font-size:10.5px;color:var(--faint);margin-top:5px;font-weight:600}
.checklist{display:flex;flex-direction:column;gap:6px;font-size:13px}
.checklist div{display:flex;gap:8px;align-items:flex-start}
.tl{display:flex;flex-direction:column;gap:0}
.tl .ev{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line2);font-size:13px}
.tl .ev:last-child{border-bottom:0}
.tl .dot{width:28px;height:28px;flex:none;border-radius:9px;background:var(--gray-bg);display:flex;align-items:center;justify-content:center;font-size:14px}
.bar{height:8px;border-radius:99px;background:var(--line2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ink);border-radius:99px}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{text-align:left;font-size:11px;color:var(--muted);font-weight:700;padding:8px 6px;border-bottom:1px solid var(--line)}
table.t td{padding:9px 6px;border-bottom:1px solid var(--line2)}
table.t td.n,table.t th.n{text-align:right;font-variant-numeric:tabular-nums}
.scrollx{overflow-x:auto}

/* panel detail (drawer) */
.sheet{position:fixed;inset:0;z-index:40;background:rgba(15,23,42,.45);display:flex;justify-content:flex-end}
.panel{background:#fff;width:100%;max-width:600px;height:100%;overflow-y:auto;display:flex;flex-direction:column;animation:slide .18s ease-out}
@keyframes slide{from{transform:translateX(30px);opacity:.6}to{transform:none;opacity:1}}
.panel-h{position:sticky;top:0;z-index:2;background:#fff;border-bottom:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;gap:10px}
.panel-h .x{border:0;background:var(--gray-bg);width:34px;height:34px;border-radius:10px;font-size:16px;cursor:pointer;flex:none}
.panel-h .t{flex:1;min-width:0}
.panel-h .t b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.panel-b{padding:16px 16px 40px}
.modal{position:fixed;inset:0;z-index:50;background:rgba(15,23,42,.5);display:flex;align-items:flex-end;justify-content:center;padding:0}
.modal .box{background:#fff;width:100%;max-width:520px;max-height:92vh;overflow-y:auto;border-radius:20px 20px 0 0;padding:18px 16px 24px}
@media(min-width:600px){.modal{align-items:center;padding:16px}.modal .box{border-radius:20px}}

/* layar login */
.center{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(900px 500px at 0% -10%,#dbeafe,transparent 60%),radial-gradient(700px 400px at 100% 0%,#fef3c7,transparent 55%),var(--bg)}
.login{width:100%;max-width:400px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);z-index:60;background:var(--ink);color:#fff;padding:11px 16px;border-radius:12px;font-size:13px;font-weight:600;max-width:calc(100% - 32px);box-shadow:0 10px 30px rgba(0,0,0,.2)}
.toast.err{background:#b91c1c}
@media(min-width:900px){.toast{bottom:30px}}
.spin{display:inline-block;width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--ink);border-radius:50%;animation:sp .7s linear infinite;vertical-align:middle}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>

<script>
// =====================================================================

//  1) Isi SUPABASE_URL dan SUPABASE_ANON_KEY di bawah (dari Supabase:
//     tombol Connect, atau Settings > API Keys). Pakai "Publishable key"
//     (sb_publishable_...). Kunci "anon" lama juga bisa, tapi Supabase
//     menghentikannya akhir 2026. Boleh juga dikosongkan: aplikasi akan
//     menanyakan alamat & kunci saat pertama dibuka di tiap perangkat.
//  2) JANGAN pernah memasang "secret key" / "service_role" di sini.
// =====================================================================
   const SUPABASE_URL = 'https://ddbkyqnfimriiuefuzmy.supabase.co';
   const SUPABASE_ANON_KEY = 'sb_publishable_UKePExVkvjhUre43wulMCA_7rWZHaj8';   // publishable key

// ---------------------------------------------------------------------
// Label tampilan
// ---------------------------------------------------------------------
const L = {
  tahap: { BARU: 'Baru', DIHUBUNGI: 'Dihubungi', PROSPEK: 'Prospek', NEGOSIASI: 'Negosiasi', DEAL: 'Deal', LOST: 'Lost' },
  rencana: { MINGGU_INI: 'Minggu ini', BULAN_INI: 'Bulan ini', '1_3_BULAN': '1–3 bulan', BELUM_PASTI: 'Belum pasti' },
  jenis: { TELEPON: 'Telepon', WHATSAPP: 'WhatsApp', KUNJUNGAN_DEALER: 'Datang ke dealer', KUNJUNGAN_RUMAH: 'Kunjungan rumah',
           TEST_RIDE: 'Test ride', PENAWARAN: 'Kirim penawaran', SIMULASI_KREDIT: 'Simulasi kredit', CATATAN: 'Catatan', SISTEM: 'Sistem' },
  ikon: { TELEPON: '📞', WHATSAPP: '💬', KUNJUNGAN_DEALER: '🏢', KUNJUNGAN_RUMAH: '🏠', TEST_RIDE: '🏍️', PENAWARAN: '📄',
          SIMULASI_KREDIT: '🧮', CATATAN: '📝', SISTEM: '⚙️' },
  lost: { HARGA_DP: 'Harga/DP terlalu tinggi', DITOLAK_LEASING: 'Ditolak leasing', DEALER_LAIN: 'Beli di dealer lain',
          MEREK_LAIN: 'Pilih merek lain', UNIT_TIDAK_ADA: 'Tipe/warna tidak tersedia', DITUNDA: 'Belum butuh / ditunda',
          TIDAK_BISA_DIHUBUNGI: 'Tidak bisa dihubungi', LAINNYA: 'Lainnya' },
  order: { SPK: 'SPK', SIAP_KIRIM: 'Siap kirim', TERKIRIM: 'Terkirim', SELESAI: 'Selesai', BATAL: 'Batal' },
  bayar: { TANDA_JADI: 'Tanda jadi', DP: 'DP', PELUNASAN: 'Pelunasan', PENCAIRAN_LEASING: 'Pencairan leasing', REFUND: 'Refund' },
  kredit: { DIAJUKAN: 'Diajukan', SURVEI: 'Survei', APPROVED: 'Approved', DITOLAK: 'Ditolak', BATAL: 'Batal' },
  reg: { BELUM: 'Belum', PROSES: 'Proses', JADI: 'Jadi', DISERAHKAN: 'Diserahkan' },
  kategori: { DIGITAL: 'Digital', OFFLINE: 'Offline', REFERENSI: 'Referensi', REPEAT: 'Repeat order' },
};
const WARNA_TAHAP = { BARU: 'p-gray', DIHUBUNGI: 'p-blue', PROSPEK: 'p-indigo', NEGOSIASI: 'p-amber', DEAL: 'p-green', LOST: 'p-red' };
const WARNA_SUHU = { HOT: 'p-red', WARM: 'p-amber', COLD: 'p-sky' };
const WARNA_ORDER = { SPK: 'p-blue', SIAP_KIRIM: 'p-amber', TERKIRIM: 'p-indigo', SELESAI: 'p-green', BATAL: 'p-gray' };
const WARNA_KREDIT = { DIAJUKAN: 'p-blue', SURVEI: 'p-amber', APPROVED: 'p-green', DITOLAK: 'p-red', BATAL: 'p-gray' };
const AKTIF = ['BARU', 'DIHUBUNGI', 'PROSPEK', 'NEGOSIASI'];

// Pesan error database -> bahasa yang mudah dimengerti
const PESAN_CONSTRAINT = {
  syarat_prospek: 'Lengkapi tipe motor, metode bayar, dan rencana beli di bagian Kebutuhan dulu.',
  followup_wajib: 'Lead aktif wajib punya jadwal follow-up.',
  lost_wajib_alasan: 'Pilih alasan lost.',
  lainnya_wajib_catatan: 'Alasan "Lainnya" wajib diisi catatan.',
  diskon_wajar: 'Diskon harus lebih kecil dari harga OTR.',
  batal_wajib_alasan: 'Isi alasan pembatalan.',
  serah_terima_lengkap: 'Isi cara serah, tanggal serah, dan alamat (jika diantar).',
  approved_lengkap: 'Isi DP disetujui, tenor, dan angsuran.',
  ditolak_wajib_alasan: 'Isi alasan penolakan leasing.',
  stnk_jadi_wajib_nopol: 'Isi nomor polisi sebelum STNK berstatus Jadi.',
  plat_setelah_stnk: 'Plat baru bisa diproses setelah STNK jadi.',
  satu_lead_aktif_per_konsumen: 'Konsumen ini sudah punya lead aktif.',
  satu_pesanan_per_unit: 'Unit ini sudah dipakai pesanan lain.',
  satu_pesanan_aktif_per_lead: 'Lead ini sudah punya SPK aktif.',
  satu_approved_per_pesanan: 'Sudah ada leasing yang approved.',
  satu_pengajuan_berjalan_per_leasing: 'Pengajuan ke leasing ini masih berjalan.',
  sumber_nama_unik: 'Nama sumber sudah ada.',
  konsumen_hp_key: 'Nomor HP sudah terdaftar pada konsumen lain.',
  unit_stok_no_rangka_key: 'Nomor rangka sudah terdaftar.',
  unit_stok_no_mesin_key: 'Nomor mesin sudah terdaftar.',
  tipe_motor_merek_model_varian_key: 'Tipe motor ini sudah ada.',
  leasing_nama_key: 'Nama leasing sudah ada.',
  izin_sumber_sumber_id_peminta_id_key: 'Anda sudah pernah minta izin untuk sumber ini.',
};
function pesanError(e) {
  const m = (e && (e.message || e.error_description || e.msg)) || String(e);
  for (const k in PESAN_CONSTRAINT) if (m.includes(k)) return PESAN_CONSTRAINT[k];
  if (m.includes('row-level security')) return 'Anda tidak punya akses untuk tindakan ini.';
  if (m.includes('Invalid login credentials')) return 'Email atau kata sandi salah.';
  if (m.includes('Failed to fetch') || m.includes('NetworkError')) return 'Tidak bisa terhubung ke server. Periksa internet Anda.';
  if (m.includes('JWT expired')) return 'Sesi habis, silakan masuk lagi.';
  if (m.includes('Could not find the function')) return 'Fitur ini belum aktif di database. Jalankan file SQL terbaru (002_akun_dari_aplikasi.sql) di Supabase.';
  return m;
}

// ---------------------------------------------------------------------
// Alat bantu kecil
// ---------------------------------------------------------------------
const $ = (s, el = document) => el.querySelector(s);
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const rp = (n) => 'Rp ' + Number(n || 0).toLocaleString('id-ID');
const TZ = { timeZone: 'Asia/Jakarta' };
const tgl = (d) => d ? new Date(d.length === 10 ? d + 'T00:00:00+07:00' : d).toLocaleDateString('id-ID', { ...TZ, day: 'numeric', month: 'short', year: 'numeric' }) : '-';
const jam = (d) => d ? new Date(d).toLocaleString('id-ID', { ...TZ, day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) : '-';
const hariIni = () => new Date().toLocaleDateString('en-CA', TZ); // YYYY-MM-DD (WIB)
const awalBulan = () => hariIni().slice(0, 8) + '01';
const tipeNama = (t) => t ? [t.merek, t.model, t.varian].filter(Boolean).join(' ') : '-';
const pill = (txt, cls) => `<span class="pill ${cls}">${esc(txt)}</span>`;
const pTahap = (t) => pill(L.tahap[t] || t, WARNA_TAHAP[t] || 'p-gray');
const pSuhu = (s, skor) => pill((s || '') + (skor != null ? ' · ' + skor : ''), WARNA_SUHU[s] || 'p-gray');
const pOrder = (s) => pill(L.order[s] || s, WARNA_ORDER[s] || 'p-gray');
const opsi = (obj, sel, kosong) => (kosong != null ? `<option value="">${esc(kosong)}</option>` : '') +
  Object.entries(obj).map(([k, v]) => `<option value="${esc(k)}"${k === sel ? ' selected' : ''}>${esc(v)}</option>`).join('');
const waLink = (hp, teks) => `https://wa.me/${esc(hp)}${teks ? '?text=' + encodeURIComponent(teks) : ''}`;
const hpTampil = (hp) => hp ? '0' + String(hp).replace(/^62/, '') : '-';
const val = (id) => { const el = document.getElementById(id); return el ? (el.type === 'checkbox' ? el.checked : el.value.trim()) : null; };
const num = (id) => { const v = val(id); return v === '' || v == null ? null : Number(v); };
const kePesanan = (o) => Number(o.harga_otr) - Number(o.diskon || 0);
function localKeISO(v) { return v ? new Date(v).toISOString() : null; }
function isoLokal(d) { // Date -> nilai input datetime-local
  const p = (n) => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;
}

let toastT;
function toast(msg, err) {
  const old = $('.toast'); if (old) old.remove();
  const el = document.createElement('div');
  el.className = 'toast' + (err ? ' err' : '');
  el.textContent = msg;
  document.body.appendChild(el);
  clearTimeout(toastT); toastT = setTimeout(() => el.remove(), err ? 5000 : 2600);
}
const gagal = (e) => { console.warn(e); toast(pesanError(e), true); };

// Jalankan query Supabase; lempar error bila gagal
async function q(p) { const { data, error } = await p; if (error) throw error; return data; }
// Update yang harus mengenai minimal 1 baris (kalau 0 = tidak punya akses)
async function ubah(tabel, isi, kolom, nilai) {
  const d = await q(sb.from(tabel).update(isi).eq(kolom, nilai).select());
  if (!d || !d.length) throw new Error('Tidak ada perubahan. Anda mungkin tidak punya akses untuk data ini.');
  return d[0];
}
async function aman(fn, btn) {
  if (btn) { btn.disabled = true; btn.dataset.t = btn.innerHTML; btn.innerHTML = '<span class="spin"></span>'; }
  try { return await fn(); } catch (e) { gagal(e); } finally { if (btn) { btn.disabled = false; btn.innerHTML = btn.dataset.t; } }
}

function bacaKonfig() {
  if (SUPABASE_URL && SUPABASE_ANON_KEY) return { url: SUPABASE_URL, key: SUPABASE_ANON_KEY, tetap: true };
  try { const c = JSON.parse(localStorage.getItem('crm_koneksi') || 'null'); if (c && c.url && c.key) return c; } catch (e) {}
  return null;
}
let sb = null;
const S = { user: null, me: null, tab: 'hari', tipe: [], leasing: [], sumber: [], orang: [], izinSaya: [],

const isAdmin = () => S.me && S.me.peran === 'ADMIN';

function layarKoneksi() {
  $('#root').innerHTML = `<div class="center"><div class="login card stack" style="padding:24px">
    <div class="brand"><div class="logo">🏍️</div><span>CRM Dealer Motor</span></div>
    <h2>Hubungkan ke Supabase</h2>
    <p class="sub">Salin dari Supabase: tombol <b>Connect</b> atau <b>Settings → API Keys</b>. Cukup sekali di perangkat ini.</p>
    <div class="field"><label>Project URL</label><input id="kUrl" class="inp" placeholder="https://xxxx.supabase.co"></div>
    <div class="field"><label>Publishable key</label><textarea id="kKey" class="inp" placeholder="sb_publishable_..."></textarea></div>
    <button class="btn pri full" onclick="simpanKoneksi(this)">Simpan & lanjut</button>
    <p class="sub">Jangan gunakan <b>secret key</b> atau <b>service_role</b>.</p></div></div>`;
}
function simpanKoneksi() {
  const url = val('kUrl').replace(/\/+$/, ''), key = val('kKey');
  if (!/^https?:\/\//.test(url) || key.length < 20) return toast('URL atau key belum benar', true);
  try { localStorage.setItem('crm_koneksi', JSON.stringify({ url, key })); } catch (e) {}
  mulai({ url, key });
}
function gantiKoneksi() {
  if (!confirm('Hapus pengaturan koneksi di perangkat ini?')) return;
  try { localStorage.removeItem('crm_koneksi'); } catch (e) {}
  location.reload();
}

async function mulai(cfg) {
  if (!window.supabase) { $('#root').innerHTML = '<div class="center"><div class="bad">Gagal memuat pustaka Supabase. Periksa internet lalu muat ulang.</div></div>'; return; }
  sb = window.supabase.createClient(cfg.url, cfg.key);
  S.cfg = cfg;
  const { data } = await sb.auth.getSession();
  if (data.session) await setelahMasuk(data.session.user); else layarLogin();
}

function layarLogin() {
  $('#root').innerHTML = `<div class="center"><form class="login card stack" style="padding:24px" onsubmit="event.preventDefault();masuk(this.querySelector('button'))">
    <div class="brand"><div class="logo">🏍️</div><span>CRM Dealer Motor</span></div>
    <div><h1>Masuk</h1><p class="sub">Gunakan email & kata sandi dari admin dealer.</p></div>
    <div class="field"><label>Email</label><input id="lgEmail" class="inp" type="email" autocomplete="username" required></div>
    <div class="field"><label>Kata sandi</label><input id="lgPass" class="inp" type="password" autocomplete="current-password" required></div>
    <button class="btn pri full" type="submit">Masuk</button>
    ${S.cfg && !S.cfg.tetap ? '<button type="button" class="btn sm" style="align-self:center" onclick="gantiKoneksi()">Ganti koneksi</button>' : ''}
  </form></div>`;
}
async function masuk(btn) {
  await aman(async () => {
    const { data, error } = await sb.auth.signInWithPassword({ email: val('lgEmail'), password: $('#lgPass').value });
    if (error) throw error;
    await setelahMasuk(data.user);
  }, btn);
}
async function keluar() { await sb.auth.signOut(); S.me = null; layarLogin(); }

async function setelahMasuk(user) {
  S.user = user;
  try {
    S.me = await q(sb.from('profiles').select('*').eq('id', user.id).maybeSingle());
    if (!S.me) throw new Error('Profil tidak ditemukan. Hubungi admin.');
    if (!S.me.aktif) { await sb.auth.signOut(); layarLogin(); return toast('Akun Anda dinonaktifkan. Hubungi admin.', true); }
    await muatMaster();
    gambarShell();
    buka(S.tab);
  } catch (e) { gagal(e); layarLogin(); }
}
async function muatMaster() {
  const [tipe, leasing, sumber, orang, izin] = await Promise.all([
    q(sb.from('tipe_motor').select('*').order('merek').order('model')),
    q(sb.from('leasing').select('*').order('nama')),
    q(sb.from('sumber_leads').select('*').order('nama')),
    q(sb.from('profiles').select('id,nama,peran,aktif,target_lead_harian,target_do_bulanan').order('nama')),
    q(sb.from('izin_sumber').select('*').eq('peminta_id', S.me.id)),
  ]);
  Object.assign(S, { tipe, leasing, sumber, orang, izinSaya: izin });
}
// sumber yang boleh dipakai user ini
function sumberBoleh() {
  return S.sumber.filter((s) => s.aktif && (isAdmin() || !s.pemilik_id || s.pemilik_id === S.me.id ||
    S.izinSaya.some((i) => i.sumber_id === s.id && i.setuju_pemilik && i.setuju_admin)));
}
const opsiTipe = (sel, kosong = 'Pilih tipe motor') => `<option value="">${kosong}</option>` +

const VIEWS = {};
async function buka(tab) {
  if (!menu().some((m) => m[0] === tab)) tab = 'hari';
  S.tab = tab;
  document.querySelectorAll('[data-tab]').forEach((b) => b.classList.toggle('on', b.dataset.tab === tab));
  const v = $('#view'); if (!v) return;
  v.innerHTML = '<div class="empty"><span class="spin"></span></div>';
  window.scrollTo(0, 0);
  try { await VIEWS[tab](v); } catch (e) { v.innerHTML = `<div class="bad">${esc(pesanError(e))}</div>`; }
}
const muatUlang = () => buka(S.tab);

// ---------------------------------------------------------------------
// Panel detail & modal
// ---------------------------------------------------------------------
function panel(judul, subjudul, isi, kunci) {
  const ada = $('#layer .panel');
  if (ada && kunci && ada.dataset.k === kunci) {           // panel sama: perbarui isi tanpa animasi & tetap di posisi gulir
    const top = ada.scrollTop;
    ada.querySelector('.panel-h .t').innerHTML = `<b>${judul}</b><span class="sub">${subjudul || ''}</span>`;
    $('#panelBody').innerHTML = isi; ada.scrollTop = top; return;
  }
  $('#layer').innerHTML = `<div class="sheet" onclick="if(event.target===this)tutupPanel()"><div class="panel" data-k="${esc(kunci || '')}">
    <div class="panel-h"><button class="x" onclick="tutupPanel()" aria-label="Tutup">✕</button>
      <div class="t"><b>${judul}</b><span class="sub">${subjudul || ''}</span></div></div>
    <div class="panel-b" id="panelBody">${isi}</div></div></div>`;
  document.body.style.overflow = 'hidden';
}
function tutupPanel() { $('#layer').innerHTML = ''; document.body.style.overflow = ''; }
function modal(isi) {
  const d = document.createElement('div');
  d.className = 'modal'; d.id = 'modal';
  d.innerHTML = `<div class="box">${isi}</div>`;
  d.onclick = (e) => { if (e.target === d) tutupModal(); };
  document.body.appendChild(d);
}
function tutupModal() { const m = $('#modal'); if (m) m.remove(); }
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { if ($('#modal')) tutupModal(); else tutupPanel(); } });

VIEWS.leads = async (v) => {
  const f = S.f;
  let qy = sb.from('leads').select('id,tahap,suhu,skor,followup_berikutnya,created_at,sales_id,konsumen(nama,hp),tipe_motor(merek,model,varian),sales:profiles(nama)')
    .order('updated_at', { ascending: false }).limit(500);
  if (f.leadTahap === 'AKTIF') qy = qy.in('tahap', AKTIF); else if (f.leadTahap) qy = qy.eq('tahap', f.leadTahap);
  if (f.leadSuhu) qy = qy.eq('suhu', f.leadSuhu);
  if (f.leadSales) qy = qy.eq('sales_id', f.leadSales);
  const data = await q(qy);
  const chipT = [['AKTIF', 'Aktif'], ...Object.entries(L.tahap)];
  v.innerHTML = `<div class="head"><div><h1>Leads</h1><p class="sub">${isAdmin() ? 'Semua lead tim' : 'Lead milik Anda'}</p></div>
      <button class="btn pri" onclick="formLead()">+ Lead baru</button></div>
    <div class="card stack" style="padding:12px">
      <input id="cari" class="inp" placeholder="Cari nama atau nomor HP…" value="${esc(f.leadCari)}" oninput="S.f.leadCari=this.value;saringLeads()">
      <div class="chips">${chipT.map(([k, t]) => `<button class="chip${f.leadTahap === k ? ' on' : ''}" onclick="S.f.leadTahap='${k}';buka('leads')">${t}</button>`).join('')}</div>
      <div class="row">
        <div class="chips">${['', 'HOT', 'WARM', 'COLD'].map((s) => `<button class="chip${f.leadSuhu === s ? ' on' : ''}" onclick="S.f.leadSuhu='${s}';buka('leads')">${s || 'Semua suhu'}</button>`).join('')}</div>
        ${isAdmin() ? `<select class="inp" style="width:auto;padding:7px 10px" onchange="S.f.leadSales=this.value;buka('leads')"><option value="">Semua sales</option>${S.orang.map((p) => `<option value="${p.id}"${f.leadSales === p.id ? ' selected' : ''}>${esc(p.nama)}</option>`).join('')}</select>` : ''}
      </div></div>
    <div id="daftarLead" class="stack mt"></div>
    <button class="fab" onclick="formLead()">+ Lead</button>`;
  S._leads = data;
  saringLeads();
};
function saringLeads() {
  const c = (S.f.leadCari || '').toLowerCase().trim();
  const cDigit = c.replace(/\D/g, '').replace(/^0/, '62');
  const d = (S._leads || []).filter((l) => !c || (l.konsumen?.nama || '').toLowerCase().includes(c) || (cDigit.length >= 3 && (l.konsumen?.hp || '').includes(cDigit)));
  const el = $('#daftarLead'); if (!el) return;
  el.innerHTML = d.length ? `<p class="sub">${d.length} lead</p>` + d.map((l) => kartuLead(l)).join('') : '<div class="empty">Tidak ada lead yang cocok.</div>';
}

let hpT;
function cekHpNanti() { clearTimeout(hpT); hpT = setTimeout(cekHp, 450); }
async function cekHp() {
  const hp = val('nHp'), info = $('#hpInfo'), btn = $('#nSimpan');
  if (!info) return;
  btn.disabled = false;
  if (hp.replace(/\D/g, '').length < 10) { info.innerHTML = ''; return; }
  try {
    const [r] = await q(sb.rpc('cek_hp', { p_hp: hp }));
    if (r.status === 'BARU') info.innerHTML = '<div class="ok">Nomor baru. Konsumen baru akan dibuat.</div>';
    else if (r.status === 'BEBAS') { info.innerHTML = `<div class="note">Konsumen lama: <b>${esc(r.nama_konsumen)}</b>. Lead baru akan dibuat (repeat order / prospek ulang).</div>`; if (!val('nNama')) $('#nNama').value = r.nama_konsumen; }
    else if (r.status === 'MILIK_SAYA') { btn.disabled = true; info.innerHTML = `<div class="warn">Konsumen ini sudah ada di lead aktif Anda. <a href="#" onclick="event.preventDefault();tutupModal();bukaLead(${r.lead_id})">Buka lead →</a></div>`; }
    else { btn.disabled = true; info.innerHTML = `<div class="bad">Sedang ditangani <b>${esc(r.pemilik)}</b>. ${r.bisa_dialihkan ? 'Tidak ada aktivitas 30 hari: minta admin mengalihkan lead ini.' : 'Tidak bisa dibuat lead ganda.'}</div>`; }
  } catch (e) { info.innerHTML = `<div class="bad">${esc(pesanError(e))}</div>`; }
}

  if ($('#layer .panel')?.dataset.k !== 'lead:' + id) panel('Memuat…', '', '<div class="empty"><span class="spin"></span></div>', 'lead:' + id);
  try {
    const [l, akt, ord] = await Promise.all([
      q(sb.from('leads').select('*, konsumen(*), tipe_motor(*), sumber:sumber_leads(nama), sales:profiles(nama)').eq('id', id).single()),
      q(sb.from('aktivitas').select('*, user:profiles(nama)').eq('lead_id', id).order('created_at', { ascending: false })),
      q(sb.from('pesanan').select('id,no_spk,status').eq('lead_id', id).order('created_at', { ascending: false })),
    ]);
    gambarLead(l, akt, ord);
  } catch (e) { $('#panelBody').innerHTML = `<div class="bad">${esc(pesanError(e))}</div>`; }
}

    ${ord.length ? `<div class="note mt">${ord.map((o) => `SPK <b>${esc(o.no_spk)}</b> ${pOrder(o.status)} <a href="#" onclick="event.preventDefault();bukaOrder(${o.id})">Buka order →</a>`).join('<br>')}</div>` : ''}

        <b>${esc(L.jenis[a.jenis])}</b>${a.hasil ? ' · ' + (a.hasil === 'TERHUBUNG' ? '<span style="color:var(--green)">terhubung</span>' : '<span style="color:var(--red)">tidak terhubung</span>') : ''}
        ${a.catatan ? `<div>${esc(a.catatan)}</div>` : ''}<div class="sub">${jam(a.created_at)} · ${esc(a.user?.nama || 'sistem')}</div></div></div>`).join('')
        : '<div class="sub">Belum ada aktivitas.</div>'}
        <div class="ev"><div class="dot">✨</div><div><b>Lead masuk</b><div class="sub">${jam(l.created_at)}${l.prospek_ulang_dari ? ` · prospek ulang dari <a href="#" onclick="event.preventDefault();bukaLead(${l.prospek_ulang_dari})">lead #${l.prospek_ulang_dari}</a>` : ''}</div></div></div>

        <input id="xCatatan" class="inp" placeholder="Catatan (wajib untuk Lainnya)">
        <div class="field"><label>Jadwal prospek ulang (opsional)</label><input id="xJadwal" type="date" class="inp" min="${hariIni()}"></div>

function pilihJenis(b) {

function setFu(hari) { const d = new Date(); d.setDate(d.getDate() + hari); d.setHours(9, 0, 0, 0); $('#aFu').value = isoLokal(d); }

async function bukaOrder(id) {
  if ($('#layer .panel')?.dataset.k !== 'order:' + id) panel('Memuat…', '', '<div class="empty"><span class="spin"></span></div>', 'order:' + id);
  try {
    const [o, bayar, kredit, reg] = await Promise.all([
      q(sb.from('pesanan').select('*, konsumen(nama,hp,alamat,kelurahan,kecamatan), tipe:tipe_motor(merek,model,varian), sales:profiles(nama), unit:unit_stok(no_rangka,no_mesin,tahun,warna)').eq('id', id).single()),
      q(sb.from('pembayaran').select('*').eq('pesanan_id', id).order('created_at')),
      q(sb.from('pengajuan_kredit').select('*, leasing(nama)').eq('pesanan_id', id).order('created_at')),
      q(sb.from('registrasi').select('*').eq('pesanan_id', id).maybeSingle()),
    ]);
    let stok = [];
    if (isAdmin() && ['SPK', 'SIAP_KIRIM'].includes(o.status)) {
      stok = await q(sb.from('unit_stok').select('*').eq('status', 'STOK').eq('tipe_motor_id', o.tipe_motor_id).ilike('warna', o.warna).order('tgl_masuk'));
    }
    gambarOrder(o, bayar, kredit, reg, stok);
  } catch (e) { $('#panelBody').innerHTML = `<div class="bad">${esc(pesanError(e))}</div>`; }
}
function gambarOrder(o, bayar, kredit, reg, stok) {
  const admin = isAdmin(), milik = admin || o.sales_id === S.me.id;
  const net = kePesanan(o);
  const total = bayar.reduce((s, b) => s + (b.jenis === 'REFUND' ? -1 : 1) * Number(b.jumlah), 0);
  const dpBayar = bayar.reduce((s, b) => s + (b.jenis === 'REFUND' ? -Number(b.jumlah) : ['TANDA_JADI', 'DP'].includes(b.jenis) ? Number(b.jumlah) : 0), 0);
  const appr = kredit.find((k) => k.status === 'APPROVED');
  const kreditJalan = kredit.some((k) => ['DIAJUKAN', 'SURVEI'].includes(k.status));
  const syarat = [
    ['Berkas KTP', o.berkas_ktp],
    ...(o.metode_bayar === 'KREDIT' ? [['Berkas KK', o.berkas_kk], ['Leasing approved', !!appr],
      ['DP terbayar ' + rp(dpBayar) + (appr ? ' dari ' + rp(appr.dp_disetujui) : ''), !!appr && dpBayar >= Number(appr.dp_disetujui)]]
      : [['Lunas ' + rp(total) + ' dari ' + rp(net), total >= net]]),
    ['Unit dialokasikan', !!o.unit_id],
  ];
  const siap = syarat.every((s) => s[1]);
  const idx = { SPK: 0, SIAP_KIRIM: 1, TERKIRIM: 2, SELESAI: 3 }[o.status] ?? -1;
  const bisaUbah = ['SPK', 'SIAP_KIRIM'].includes(o.status);
  const k = o.konsumen;

  panel(esc(o.no_spk) + ' · ' + esc(k.nama), `${esc(tipeNama(o.tipe))} ${esc(o.warna)} · ${o.metode_bayar === 'KREDIT' ? 'Kredit' : 'Cash'} · ${esc(o.sales?.nama)}`, `
    <div class="row">${pOrder(o.status)}<span class="sub">SPK ${tgl(o.tgl_spk)}</span>
      <a class="btn sm wa" style="margin-left:auto" href="${waLink(k.hp)}" target="_blank" rel="noopener">💬 WA</a>
      <button class="btn sm" onclick="bukaLead(${o.lead_id})">Lead</button></div>
    ${o.status !== 'BATAL' ? `<div class="mt"><div class="steps">${[0, 1, 2, 3].map((i) => `<div class="${i <= idx ? 'on' : ''}"></div>`).join('')}</div>
      <div class="steps-l"><span>SPK</span><span>Siap kirim</span><span>Terkirim</span><span>Selesai</span></div></div>`

    ${c.status === 'APPROVED' ? `<div class="mt" style="font-size:13px">DP ${rp(c.dp_disetujui)} · ${c.tenor_bulan} bulan × ${rp(c.angsuran)}</div>` : ''}
    ${c.status === 'DITOLAK' ? `<div class="mt sub">Alasan: ${esc(c.alasan_tolak)}</div>` : ''}
    ${bisa && ['DIAJUKAN', 'SURVEI'].includes(c.status) ? `<div class="stack mt">
      <div class="row">${c.status === 'DIAJUKAN' ? `<button class="btn sm" onclick="ubahKredit(${c.id},${o.id},{status:'SURVEI'},this)">Survei</button>` : ''}
        <button class="btn sm danger" onclick="ubahKredit(${c.id},${o.id},{status:'BATAL'},this)">Batal</button></div>
      <div class="grid2"><input id="kDp${c.id}" type="number" class="inp" placeholder="DP disetujui"><input id="kTenor${c.id}" type="number" class="inp" placeholder="Tenor (bulan)"></div>
      <div class="row"><input id="kAng${c.id}" type="number" class="inp" style="flex:1" placeholder="Angsuran / bulan">
        <button class="btn sm green" onclick="ubahKredit(${c.id},${o.id},{status:'APPROVED',dp_disetujui:num('kDp${c.id}'),tenor_bulan:num('kTenor${c.id}'),angsuran:num('kAng${c.id}')},this)">Approved</button></div>
      <div class="row"><input id="kTolak${c.id}" class="inp" style="flex:1" placeholder="Alasan ditolak">
        <button class="btn sm danger" onclick="ubahKredit(${c.id},${o.id},{status:'DITOLAK',alasan_tolak:val('kTolak${c.id}')},this)">Ditolak</button></div>

function gambarRegistrasi(r, admin) {

    <div class="grid2"><div class="field"><label>STNK</label>${sel('rStnk', L.reg, r.stnk_status)}</div>

    <div class="grid2"><div class="field"><label>Plat (TNKB)</label>${sel('rTnkb', { BELUM: 'Belum', JADI: 'Jadi', DISERAHKAN: 'Diserahkan' }, r.tnkb_status)}</div>
      <div class="field"><label>BPKB → ${r.bpkb_penerima === 'LEASING' ? 'leasing' : 'konsumen'}</label>${sel('rBpkb', L.reg, r.bpkb_status)}</div></div>
    <div class="sub">${r.stnk_jadi_at ? 'STNK jadi ' + tgl(r.stnk_jadi_at) : ''}${r.stnk_serah_at ? ' · diserahkan ' + tgl(r.stnk_serah_at) : ''}${r.bpkb_serah_at ? ' · BPKB diserahkan ' + tgl(r.bpkb_serah_at) : ''}</div>
    ${admin ? `<input id="rCatatan" class="inp" placeholder="Catatan (biro jasa, dll)" value="${esc(r.catatan)}">
      <button class="btn pri" onclick="simpanRegistrasi(${r.pesanan_id},this)">Simpan registrasi</button>

}
function pilihSerah(b) {
  document.querySelectorAll('#caraSerah .chip').forEach((c) => c.classList.toggle('on', c === b));
  $('#alamatKirimF').classList.toggle('hidden', b.dataset.c !== 'ANTAR');
}
async function ubahOrder(id, isi, pesan, btn) {
  await aman(async () => { await ubah('pesanan', isi, 'id', id); toast(pesan); bukaOrder(id); muatUlang(); }, btn);
}
async function simpanBerkas(id, status, btn) {
  const isi = { berkas_ktp: val('bKtp'), berkas_kk: val('bKk'), berkas_npwp: val('bNpwp'), berkas_lain: val('bLain') || null };
  if (status === 'SPK' && $('#bDiskon')) isi.diskon = num('bDiskon') || 0;
  if ($('#bHarga')) isi.harga_otr = num('bHarga');
  await ubahOrder(id, isi, 'Berkas tersimpan', btn);
}
async function serahTerima(id, btn) {
  const cara = $('#caraSerah .chip.on').dataset.c;
  if (!confirm('Konfirmasi unit sudah diterima konsumen?')) return;
  await ubahOrder(id, { status: 'TERKIRIM', cara_serah: cara, tgl_serah: val('tSerah'), alamat_kirim: cara === 'ANTAR' ? val('tAlamat') : null }, 'Unit diserahkan 🎉', btn);
}
async function batalOrder(id, btn) {
  if (!val('xBatal')) return toast('Isi alasan batal', true);
  if (!confirm('Batalkan SPK ini?')) return;
  await ubahOrder(id, { status: 'BATAL', alasan_batal: val('xBatal') }, 'SPK dibatalkan', btn);
}
async function ajukanKredit(oid, btn) {
  await aman(async () => { await q(sb.from('pengajuan_kredit').insert({ pesanan_id: oid, leasing_id: num('kLeasing') })); toast('Pengajuan dibuat'); bukaOrder(oid); }, btn);
}
async function ubahKredit(cid, oid, isi, btn) {
  if (isi.status === 'BATAL' && !confirm('Batalkan pengajuan ini?')) return;
  await aman(async () => { await ubah('pengajuan_kredit', isi, 'id', cid); toast('Pengajuan: ' + L.kredit[isi.status]); bukaOrder(oid); }, btn);
}
async function catatBayar(oid, btn) {
  if (!num('pJumlah')) return toast('Isi jumlah', true);
  await aman(async () => {
    await q(sb.from('pembayaran').insert({ pesanan_id: oid, jenis: val('pJenis'), jumlah: num('pJumlah'), cara: val('pCara'), tgl: val('pTgl'), catatan: val('pCatatan') || null }));
    toast('Pembayaran tercatat'); bukaOrder(oid);
  }, btn);
}
async function simpanRegistrasi(oid, btn) {
  await aman(async () => {
    await ubah('registrasi', { stnk_status: val('rStnk'), no_polisi: val('rNopol') || null, tnkb_status: val('rTnkb'), bpkb_status: val('rBpkb'), catatan: val('rCatatan') || null }, 'pesanan_id', oid);
    toast('Registrasi tersimpan'); bukaOrder(oid); muatUlang();
  }, btn);
}

function htmlPapan(papan) {
  return papan.length ? papan.map((p, i) => {
    const pct = p.target_do_bulanan ? Math.min(100, Math.round(100 * p.unit_terkirim / p.target_do_bulanan)) : 0;
    return `<div class="card" style="padding:12px 14px${p.sales_id === S.me.id ? ';border-color:var(--ink)' : ''}">
      <div class="row between"><b>${i + 1}. ${esc(p.nama)}${p.sales_id === S.me.id ? ' (Anda)' : ''}</b><span class="sub">${p.unit_terkirim}/${p.target_do_bulanan} unit</span></div>
      <div class="bar mt" style="margin-top:8px"><i style="width:${pct}%"></i></div>
      <div class="row sub" style="margin-top:6px;gap:12px"><span>${p.lead_baru} lead</span><span>${p.spk} SPK</span><span>konversi ${p.konversi_persen ?? 0}%</span>${p.followup_terlambat ? `<span style="color:var(--red)">${p.followup_terlambat} FU terlambat</span>` : ''}</div></div>`;
  }).join('') : '<div class="empty">Belum ada sales aktif.</div>';
}

      <div class="mid"><div class="nm">${esc(l.nama_depan)} <span class="sub">· ${esc(hpTampil(l.hp_samar))}</span></div><div class="meta">${esc(l.tipe_motor || 'Tipe belum dipilih')} · ${esc(l.sales)}</div>

VIEWS.laporan = async (v) => {
  const { lapDari: d, lapSampai: s } = S.f;

    q(sb.rpc('laporan_funnel', { p_dari: d, p_sampai: s })), q(sb.rpc('laporan_sumber', { p_dari: d, p_sampai: s })),
    q(sb.rpc('laporan_lost', { p_dari: d, p_sampai: s })), q(sb.rpc('papan_tim', { p_dari: d, p_sampai: s })),
    q(sb.from('unit_stok').select('status')),
  ]);

  const awal = Number(funnel[0]?.jumlah || 0);

        <span class="sub">s/d</span><input type="date" class="inp" style="width:auto" value="${s}" onchange="S.f.lapSampai=this.value;buka('laporan')"></div></div>
    <div class="grid4">
      <div class="stat"><b>${awal}</b><span>Lead masuk</span></div>
      <div class="stat"><b>${funnel[4]?.jumlah ?? 0}</b><span>Pernah SPK</span></div>
      <div class="stat"><b>${funnel[5]?.jumlah ?? 0}</b><span>Unit terkirim</span></div>
      <div class="stat"><b>${awal ? Math.round(100 * Number(funnel[5]?.jumlah || 0) / awal) : 0}%</b><span>Konversi lead → unit</span></div>
    </div>
    <div class="card mt"><h2>Funnel</h2><p class="sub">Berapa lead yang pernah mencapai tiap tahap</p>
      <div class="stack mt">${funnel.map((f, i) => `<div><div class="row between" style="font-size:13px"><b>${esc(f.tahap)}</b><span>${f.jumlah}${i && awal ? ` <span class="sub">(${Math.round(100 * f.jumlah / awal)}%)</span>` : ''}</span></div>
        <div class="bar" style="height:12px;margin-top:4px"><i style="width:${100 * f.jumlah / maks}%"></i></div></div>`).join('')}</div></div>
    <div class="card mt"><h2>Per sumber</h2><div class="scrollx"><table class="t mt"><tr><th>Sumber</th><th class="n">Lead</th><th class="n">SPK</th><th class="n">Unit</th><th class="n">Konversi</th></tr>
      ${sumber.filter((x) => Number(x.lead)).map((x) => `<tr><td>${esc(x.sumber)}</td><td class="n">${x.lead}</td><td class="n">${x.spk}</td><td class="n">${x.unit_terkirim}</td><td class="n">${x.konversi_persen ?? 0}%</td></tr>`).join('') || '<tr><td colspan="5" class="sub">Belum ada data.</td></tr>'}</table></div></div>
    <div class="card mt"><h2>Alasan lost</h2><div class="stack mt">${lost.length ? lost.map((x) => `<div><div class="row between" style="font-size:13px"><span>${esc(L.lost[x.alasan])}</span><b>${x.jumlah}</b></div>

    <div class="card mt"><h2>Papan tim</h2><div class="stack mt">${htmlPapan(papan)}</div></div>

  v.innerHTML = `<div class="head"><div><h1>Lainnya</h1></div></div>
    <div class="card"><div class="row between"><div><b>${esc(S.me.nama)}</b><div class="sub">${esc(S.user.email)} · ${admin ? 'Admin' : 'Sales'}</div></div>
      <div class="row"><button class="btn sm" onclick="formSandi()">Ganti sandi</button><button class="btn sm danger" onclick="keluar()">Keluar</button></div></div></div>

    ${perluSaya.length ? `<div class="card mt"><h2>Permintaan izin sumber</h2><div class="stack mt">${perluSaya.map((i) => `<div class="warn"><b>${esc(i.peminta.nama)}</b> minta izin memakai <b>${esc(i.sumber.nama)}</b>
      <div class="sub">Pemilik: ${i.setuju_pemilik ? '✅' : '⏳'} · Admin: ${i.setuju_admin ? '✅' : '⏳'}</div>
      <div class="row mt"><button class="btn sm green" onclick="jawabIzin(${i.id},true,this)">Setujui</button><button class="btn sm danger" onclick="jawabIzin(${i.id},false,this)">Tolak</button></div></div>`).join('')}</div></div>` : ''}

    <div class="card mt"><div class="row between"><h2>Sumber leads</h2><button class="btn sm pri" onclick="formSumber()">+ Sumber ${admin ? 'global' : 'private'}</button></div>
      <p class="sub">Sumber global bebas dipakai. Sumber private hanya bisa dipakai pemiliknya atau yang disetujui pemilik <b>dan</b> admin.</p>
      <div class="stack mt">${S.sumber.map((s) => {
        const iz = S.izinSaya.find((i) => i.sumber_id === s.id);
        const boleh = sumberBoleh().some((x) => x.id === s.id);
        const milik = admin || s.pemilik_id === S.me.id;
        return `<div class="row between" style="padding:8px 0;border-bottom:1px solid var(--line2)"><div><b style="font-size:13px">${esc(s.nama)}</b> ${s.aktif ? '' : pill('nonaktif', 'p-gray')}
          <div class="sub">${s.pemilik_id ? 'Private · ' + esc(namaOrang(s.pemilik_id)) : 'Global'} · ${esc(L.kategori[s.kategori])}</div></div>
          <div class="row">${milik ? `<button class="btn sm" onclick="formSumber(${s.id})">Ubah</button>` : boleh ? pill('Boleh pakai', 'p-green')
            : iz ? (iz.setuju_pemilik === false || iz.setuju_admin === false ? pill('Ditolak', 'p-red') + ` <button class="btn sm" onclick="batalIzin(${iz.id},this)">Hapus</button>` : pill('Menunggu izin', 'p-amber'))
            : `<button class="btn sm" onclick="mintaIzin(${s.id},this)">Minta izin</button>`}</div></div>`;
      }).join('')}</div></div>

    <div class="card mt"><div class="row between"><h2>Stok unit</h2>${admin ? '<button class="btn sm pri" onclick="formUnit()">+ Unit</button>' : ''}</div>
      <div class="stack mt">${Object.keys(ringkasStok).length ? Object.entries(ringkasStok).map(([k, n]) => `<div class="row between" style="font-size:13px"><span>${esc(k)}</span><b>${n} unit</b></div>`).join('') : '<p class="sub">Stok kosong.</p>'}</div>
      ${admin ? `<details class="mt"><summary class="sub" style="cursor:pointer">Semua unit (${stok.length})</summary><div class="scrollx"><table class="t mt"><tr><th>No rangka</th><th>Tipe</th><th>Status</th><th></th></tr>
        ${stok.map((u) => `<tr><td>${esc(u.no_rangka)}<div class="sub">${esc(u.no_mesin)}</div></td><td>${esc(tipeNama(u.tipe))}<div class="sub">${esc(u.warna)} · ${u.tahun}</div></td><td>${pill(u.status, u.status === 'STOK' ? 'p-green' : u.status === 'TERJUAL' ? 'p-gray' : 'p-amber')}</td>
          <td>${u.status === 'STOK' ? `<button class="btn sm" onclick="formUnit(${u.id})">Ubah</button>` : ''}</td></tr>`).join('')}</table></div></details>` : ''}</div>

    ${admin ? `<div class="card mt"><div class="row between"><h2>Tipe motor & harga OTR</h2><button class="btn sm pri" onclick="formTipe()">+ Tipe</button></div>
      <div class="scrollx"><table class="t mt"><tr><th>Tipe</th><th class="n">Harga OTR</th><th></th></tr>${S.tipe.map((t) => `<tr><td>${esc(tipeNama(t))} ${t.aktif ? '' : pill('nonaktif', 'p-gray')}</td><td class="n">${rp(t.harga_otr)}</td><td class="n"><button class="btn sm" onclick="formTipe(${t.id})">Ubah</button></td></tr>`).join('') || '<tr><td colspan="3" class="sub">Belum ada tipe motor. Tambahkan dulu.</td></tr>'}</table></div></div>

    <div class="card mt"><div class="row between"><h2>Leasing</h2><button class="btn sm pri" onclick="formLeasing()">+ Leasing</button></div>
      <div class="row mt">${S.leasing.map((x) => `<button class="chip${x.aktif ? '' : ''}" onclick="formLeasing(${x.id})">${esc(x.nama)}${x.aktif ? '' : ' (nonaktif)'}</button>`).join('')}</div></div>

    <div class="card mt"><div class="row between"><h2>Pengguna</h2><button class="btn sm pri" onclick="formAkun()">+ Akun baru</button></div>
      ${S.fitur002 ? '<p class="sub">Buat akun Sales atau Admin langsung dari sini. Pengguna yang keluar cukup dinonaktifkan, jangan dihapus.</p>'
        : '<div class="warn mt">Untuk membuat akun dari aplikasi, jalankan dulu file <b>002_akun_dari_aplikasi.sql</b> di Supabase SQL Editor. Sementara itu, akun bisa dibuat di Supabase → Authentication → Users → Add user.</div>'}
      <div class="stack mt">${S.orang.map((p) => `<div class="row between" style="padding:8px 0;border-bottom:1px solid var(--line2)"><div><b style="font-size:13px">${esc(p.nama)}</b> ${pill(p.peran === 'ADMIN' ? 'Admin' : 'Sales', p.peran === 'ADMIN' ? 'p-indigo' : 'p-blue')} ${p.aktif ? '' : pill('nonaktif', 'p-red')}
        <div class="sub">${S.emailOrang[p.id] ? esc(S.emailOrang[p.id].email) + ' · ' : ''}Target ${p.target_lead_harian} lead/hari · ${p.target_do_bulanan} unit/bulan${S.emailOrang[p.id] ? ' · ' + (S.emailOrang[p.id].terakhir_masuk ? 'terakhir masuk ' + jam(S.emailOrang[p.id].terakhir_masuk) : 'belum pernah masuk') : ''}</div></div>
        <button class="btn sm" onclick="formOrang('${p.id}')">Ubah</button></div>`).join('')}</div></div>` : ''}

    ${!S.cfg.tetap ? `<div class="card mt"><h2>Koneksi</h2><p class="sub mt">${esc(S.cfg.url)}</p><button class="btn sm mt" onclick="gantiKoneksi()">Ganti koneksi</button></div>` : ''}`;
};

// ---------- form-form kecil ----------
function formSandi() {
  modal(`<h2>Ganti kata sandi</h2><div class="stack mt"><input id="sdBaru" type="password" class="inp" placeholder="Kata sandi baru (min. 8 karakter)">
    <button class="btn pri" onclick="gantiSandi(this)">Simpan</button><button class="btn" onclick="tutupModal()">Batal</button></div>`);
}
async function gantiSandi(btn) {
  if ((val('sdBaru') || '').length < 8) return toast('Minimal 8 karakter', true);
  await aman(async () => { const { error } = await sb.auth.updateUser({ password: $('#sdBaru').value }); if (error) throw error; tutupModal(); toast('Kata sandi diganti'); }, btn);
}
function formSumber(id) {
  const s = S.sumber.find((x) => x.id === id) || { nama: '', kategori: 'OFFLINE', aktif: true };
  modal(`<h2>${id ? 'Ubah' : 'Tambah'} sumber</h2><div class="stack mt">
    <input id="smNama" class="inp" placeholder="Contoh: Komunitas Ojol Cikadu" value="${esc(s.nama)}">
    <select id="smKat" class="inp">${opsi(L.kategori, s.kategori)}</select>
    <label class="chk"><input type="checkbox" id="smAktif" ${s.aktif ? 'checked' : ''}> Aktif</label>
    ${!isAdmin() && !id ? '<p class="sub">Sumber ini menjadi private milik Anda.</p>' : ''}
    <button class="btn pri" onclick="simpanSumber(${id || 'null'},this)">Simpan</button><button class="btn" onclick="tutupModal()">Batal</button></div>`);
}
async function simpanSumber(id, btn) {
  if (!val('smNama')) return toast('Isi nama sumber', true);
  const isi = { nama: val('smNama'), kategori: val('smKat'), aktif: val('smAktif') };
  await aman(async () => {
    if (id) await ubah('sumber_leads', isi, 'id', id); else await q(sb.from('sumber_leads').insert(isi));
    tutupModal(); toast('Sumber tersimpan'); buka('lain');
  }, btn);
}
async function mintaIzin(sid, btn) {
  await aman(async () => { await q(sb.from('izin_sumber').insert({ sumber_id: sid })); toast('Permintaan izin dikirim'); buka('lain'); }, btn);
}
async function batalIzin(id, btn) {
  await aman(async () => { await q(sb.from('izin_sumber').delete().eq('id', id)); buka('lain'); }, btn);
}
async function jawabIzin(id, setuju, btn) {
  const iz = (await q(sb.from('izin_sumber').select('*, sumber:sumber_leads(pemilik_id)').eq('id', id).single()));
  const isi = {};
  if (iz.sumber.pemilik_id === S.me.id) isi.setuju_pemilik = setuju;
  if (isAdmin()) isi.setuju_admin = setuju;
  await aman(async () => { await ubah('izin_sumber', isi, 'id', id); toast(setuju ? 'Disetujui' : 'Ditolak'); buka('lain'); }, btn);
}
function formUnit(id) {
  modal(`<h2>${id ? 'Ubah' : 'Tambah'} unit</h2><div class="stack mt">
    <select id="unTipe" class="inp">${opsiTipe(null)}</select>
    <div class="grid2"><input id="unWarna" class="inp" placeholder="Warna"><input id="unTahun" type="number" class="inp" value="${new Date().getFullYear()}"></div>
    <input id="unRangka" class="inp" placeholder="Nomor rangka" style="text-transform:uppercase">
    <input id="unMesin" class="inp" placeholder="Nomor mesin" style="text-transform:uppercase">
    <button class="btn pri" onclick="simpanUnit(${id || 'null'},this)">Simpan</button><button class="btn" onclick="tutupModal()">Batal</button></div>`);
  if (id) sb.from('unit_stok').select('*').eq('id', id).single().then(({ data: u }) => {
    if (!u) return; $('#unTipe').value = u.tipe_motor_id; $('#unWarna').value = u.warna; $('#unTahun').value = u.tahun; $('#unRangka').value = u.no_rangka; $('#unMesin').value = u.no_mesin;
  });
}
async function simpanUnit(id, btn) {
  const isi = { tipe_motor_id: num('unTipe'), warna: val('unWarna'), tahun: num('unTahun'), no_rangka: val('unRangka'), no_mesin: val('unMesin') };
  if (!isi.tipe_motor_id || !isi.warna || !isi.no_rangka || !isi.no_mesin) return toast('Lengkapi semua kolom', true);
  await aman(async () => { if (id) await ubah('unit_stok', isi, 'id', id); else await q(sb.from('unit_stok').insert(isi)); tutupModal(); toast('Unit tersimpan'); buka('lain'); }, btn);
}
function formTipe(id) {
  const t = S.tipe.find((x) => x.id === id) || { merek: '', model: '', varian: '', harga_otr: '', aktif: true };
  modal(`<h2>${id ? 'Ubah' : 'Tambah'} tipe motor</h2><div class="stack mt">
    <div class="grid2"><input id="tmMerek" class="inp" placeholder="Merek (Honda)" value="${esc(t.merek)}"><input id="tmModel" class="inp" placeholder="Model (BeAT)" value="${esc(t.model)}"></div>
    <input id="tmVarian" class="inp" placeholder="Varian (CBS / Deluxe)" value="${esc(t.varian)}">
    <div class="field"><label>Harga OTR (Rp)</label><input id="tmHarga" type="number" class="inp" value="${t.harga_otr}"></div>
    <label class="chk"><input type="checkbox" id="tmAktif" ${t.aktif ? 'checked' : ''}> Aktif (bisa dipilih)</label>
    <button class="btn pri" onclick="simpanTipe(${id || 'null'},this)">Simpan</button><button class="btn" onclick="tutupModal()">Batal</button></div>`);
}
async function simpanTipe(id, btn) {
  const isi = { merek: val('tmMerek'), model: val('tmModel'), varian: val('tmVarian'), harga_otr: num('tmHarga'), aktif: val('tmAktif') };
  if (!isi.merek || !isi.model || !isi.harga_otr) return toast('Merek, model, dan harga wajib', true);
  await aman(async () => { if (id) await ubah('tipe_motor', isi, 'id', id); else await q(sb.from('tipe_motor').insert(isi)); tutupModal(); toast('Tipe motor tersimpan'); buka('lain'); }, btn);
}
function formLeasing(id) {
  const x = S.leasing.find((y) => y.id === id) || { nama: '', aktif: true };
  modal(`<h2>${id ? 'Ubah' : 'Tambah'} leasing</h2><div class="stack mt"><input id="lsNama" class="inp" value="${esc(x.nama)}" placeholder="Nama leasing">
    <label class="chk"><input type="checkbox" id="lsAktif" ${x.aktif ? 'checked' : ''}> Aktif</label>
    <button class="btn pri" onclick="simpanLeasing(${id || 'null'},this)">Simpan</button><button class="btn" onclick="tutupModal()">Batal</button></div>`);
}
async function simpanLeasing(id, btn) {
  const isi = { nama: val('lsNama'), aktif: val('lsAktif') };
  if (!isi.nama) return toast('Isi nama', true);
  await aman(async () => { if (id) await ubah('leasing', isi, 'id', id); else await q(sb.from('leasing').insert(isi)); tutupModal(); toast('Leasing tersimpan'); buka('lain'); }, btn);
}
function formOrang(id) {
  const p = S.orang.find((x) => x.id === id);
  modal(`<h2>Ubah pengguna</h2><div class="stack mt">
    <div class="field"><label>Nama</label><input id="ogNama" class="inp" value="${esc(p.nama)}"></div>
    <div class="grid2"><div class="field"><label>Peran</label><select id="ogPeran" class="inp" ${id === S.me.id ? 'disabled' : ''}>${opsi({ SALES: 'Sales', ADMIN: 'Admin' }, p.peran)}</select></div>
      <div class="field"><label>Status</label><select id="ogAktif" class="inp" ${id === S.me.id ? 'disabled' : ''}>${opsi({ true: 'Aktif', false: 'Nonaktif' }, String(p.aktif))}</select></div></div>
    <div class="grid2"><div class="field"><label>Target lead/hari</label><input id="ogTl" type="number" class="inp" value="${p.target_lead_harian}"></div>
      <div class="field"><label>Target unit/bulan</label><input id="ogTd" type="number" class="inp" value="${p.target_do_bulanan}"></div></div>
    <button class="btn pri" onclick="simpanOrang('${id}',this)">Simpan</button>
    ${S.fitur002 && id !== S.me.id ? `<div class="sec" style="margin-top:6px;padding-top:12px"><h3>Reset kata sandi</h3><p class="sub" style="margin-bottom:8px">Untuk pengguna yang lupa sandi. Kirim sandi baru ke orangnya, lalu minta ia menggantinya sendiri.</p>
      <div class="row"><input id="ogSandi" class="inp" style="flex:1" value="${sandiAcak()}"><button class="btn sm" onclick="$('#ogSandi').value=sandiAcak()">Acak</button></div>
      <button class="btn mt" style="width:100%" onclick="resetSandi('${id}',this)">Simpan sandi baru</button></div>` : ''}
    <button class="btn" onclick="tutupModal()">Batal</button></div>`);
}
async function simpanOrang(id, btn) {
  const isi = { nama: val('ogNama'), target_lead_harian: num('ogTl') || 0, target_do_bulanan: num('ogTd') || 0 };
  if (id !== S.me.id) { isi.peran = val('ogPeran'); isi.aktif = val('ogAktif') === 'true'; }
  await aman(async () => { await ubah('profiles', isi, 'id', id); tutupModal(); toast('Pengguna tersimpan'); buka('lain'); }, btn);
}

// ---------- akun baru & reset sandi (butuh file SQL 002) ----------
function sandiAcak() {
  const huruf = 'abcdefghjkmnpqrstuvwxyz', angka = '23456789';
  const r = (str) => str[Math.floor(Math.random() * str.length)];
  let s = '';
  for (let i = 0; i < 6; i++) s += r(huruf);
  for (let i = 0; i < 4; i++) s += r(angka);
  return s.charAt(0).toUpperCase() + s.slice(1);
}
function formAkun() {
  if (!S.fitur002) return toast('Jalankan dulu file 002_akun_dari_aplikasi.sql di Supabase', true);
  modal(`<div class="row between"><h2>Akun baru</h2><button class="btn sm" onclick="tutupModal()">Tutup</button></div>
    <div class="stack mt">
      <div class="field"><label>Nama lengkap *</label><input id="akNama" class="inp" placeholder="Contoh: Rizki Ramadhan"></div>
      <div class="field"><label>Email *</label><input id="akEmail" class="inp" type="email" inputmode="email" placeholder="nama@gmail.com"></div>
      <div class="field"><label>Kata sandi awal *</label><div class="row"><input id="akSandi" class="inp" style="flex:1" value="${sandiAcak()}"><button class="btn sm" onclick="$('#akSandi').value=sandiAcak()">Acak</button></div>
        <span class="sub">Minimal 8 karakter. Pengguna bisa menggantinya sendiri setelah masuk.</span></div>
      <div class="field"><label>Peran</label><select id="akPeran" class="inp">${opsi({ SALES: 'Sales', ADMIN: 'Admin' }, 'SALES')}</select></div>
      <button class="btn pri full" onclick="simpanAkun(this)">Buat akun</button>
    </div>`);
  setTimeout(() => $('#akNama')?.focus(), 50);
}
async function simpanAkun(btn) {
  const nama = val('akNama'), email = val('akEmail').toLowerCase(), sandi = $('#akSandi').value, peran = val('akPeran');
  if (!nama || !email || !sandi) return toast('Nama, email, dan kata sandi wajib diisi', true);
  if (sandi.length < 8) return toast('Kata sandi minimal 8 karakter', true);
  await aman(async () => {
    await q(sb.rpc('admin_buat_akun', { p_email: email, p_sandi: sandi, p_nama: nama, p_peran: peran }));
    tutupModal(); toast('Akun dibuat'); buka('lain');
    bagikanAkun(nama, email, sandi, 'Akun CRM Dealer Motor Anda sudah dibuat.');
  }, btn);
}
async function resetSandi(id, btn) {
  const sandi = $('#ogSandi').value;
  if (sandi.length < 8) return toast('Kata sandi minimal 8 karakter', true);
  if (!confirm('Ganti kata sandi pengguna ini?')) return;
  await aman(async () => {
    await q(sb.rpc('admin_reset_sandi', { p_user: id, p_sandi: sandi }));
    const p = S.orang.find((x) => x.id === id) || {};
    tutupModal(); toast('Kata sandi diganti');
    bagikanAkun(p.nama, (S.emailOrang[id] || {}).email || '', sandi, 'Kata sandi CRM Dealer Motor Anda sudah direset.');
  }, btn);
}
function bagikanAkun(nama, email, sandi, judul) {
  const link = location.href.split('#')[0].split('?')[0];
  const teks = `Halo ${String(nama || '').split(' ')[0]}, ${judul}\n\nLink: ${link}\nEmail: ${email}\nKata sandi: ${sandi}\n\nSetelah masuk, ganti kata sandi di menu Lainnya → Ganti sandi. Jangan bagikan ke orang lain.`;
  S._teksAkun = teks;
  modal(`<h2>Kirim ke ${esc(nama)}</h2><p class="sub mt">Kata sandi ini hanya ditampilkan sekarang. Kirim ke orangnya sebelum menutup.</p>
    <pre id="teksAkun" class="inp" style="white-space:pre-wrap;font-family:inherit;margin-top:10px">${esc(teks)}</pre>
    <div class="stack mt"><a class="btn wa full" style="text-align:center" href="https://wa.me/?text=${encodeURIComponent(teks)}" target="_blank" rel="noopener">💬 Kirim lewat WhatsApp</a>
      <button class="btn full" onclick="salinAkun(this)">Salin teks</button><button class="btn full" onclick="tutupModal()">Selesai</button></div>`);
}
async function salinAkun(btn) {
  try { await navigator.clipboard.writeText(S._teksAkun); btn.textContent = 'Tersalin ✓'; }
  catch (e) { const r = document.createRange(); r.selectNodeContents($('#teksAkun')); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); toast('Tekan lama lalu Salin'); }
}

// =====================================================================
// MULAI
// =====================================================================
(function () {
  const cfg = bacaKonfig();
  if (cfg) mulai(cfg); else layarKoneksi();
})();
